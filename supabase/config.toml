project_id = "eqooinqoezitzelhfgjg"

[auth]
enable_anonymous_sign_ins = true

# Edge functions use <Name>.ts entrypoints (not the CLI's default index.ts), so
# each one is mapped here. The shared code in functions/_shared is bundled via
# the relative import each function already uses.
[functions.CreateQuizInstance]
verify_jwt = true
entrypoint = "./functions/CreateQuizInstance/CreateQuizInstance.ts"

[functions.JoinQuizInstance]
verify_jwt = true
entrypoint = "./functions/JoinQuizInstance/JoinQuizInstance.ts"

[functions.StartQuizInstance]
verify_jwt = true
entrypoint = "./functions/StartQuizInstance/StartQuizInstance.ts"
